<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的世界足迹地图</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://tile.openstreetmap.org">
  <link rel="preconnect" href="https://nominatim.openstreetmap.org">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <aside class="sidebar" aria-label="足迹管理" data-i18n-aria="sidebarLabel">
      <header class="brand">
        <div class="brand-top">
          <p class="eyebrow">Travel Footprints</p>
          <label class="language-switch" for="languageSelect">
            <span data-i18n="languageLabel">语言</span>
            <select id="languageSelect" aria-label="选择语言" data-i18n-aria="languageSelectLabel">
              <option value="zh-CN">中文</option>
              <option value="en">English</option>
            </select>
          </label>
        </div>
        <h1 data-i18n="appTitle">我的世界足迹</h1>
        <p class="stats"><span id="footprintCount">0</span> <span id="footprintUnit">个地点已点亮</span></p>
      </header>

      <form class="footprint-form" id="footprintForm" autocomplete="off">
        <label class="search-field">
          <span data-i18n="cityLabel">城市</span>
          <input id="placeInput" name="place" type="search" placeholder="输入城市名，例如：上海、巴黎、东京" data-i18n-placeholder="cityPlaceholder" required>
          <div class="suggestions" id="suggestions" role="listbox" aria-label="城市搜索结果" data-i18n-aria="suggestionsLabel"></div>
        </label>

        <label>
          <span data-i18n="dateLabel">日期</span>
          <input id="dateInput" name="date" type="date">
        </label>

        <label>
          <span data-i18n="noteLabel">备注</span>
          <textarea id="noteInput" name="note" rows="3" placeholder="写一点这次旅程的记忆" data-i18n-placeholder="notePlaceholder"></textarea>
        </label>

        <div class="actions">
          <button class="button primary" id="submitButton" type="submit" data-i18n="addButton">添加足迹</button>
          <button class="button ghost" id="locateButton" type="button" data-i18n="locateButton">定位到我</button>
        </div>
      </form>

      <section class="photo-import" aria-label="照片导入" data-i18n-aria="photoImportLabel">
        <div>
          <h2 data-i18n="photoImportTitle">从照片导入</h2>
          <p data-i18n="photoImportHint">选择带有定位信息的原图，自动生成照片足迹。</p>
        </div>
        <label class="file-picker">
          <span data-i18n="photoChooseButton">选择照片</span>
          <input id="photoInput" type="file" accept="image/*" multiple>
        </label>
        <p class="photo-status" id="photoImportStatus" data-i18n="photoImportIdle">还没有导入照片。</p>
        <ul class="photo-import-list" id="photoImportList"></ul>
      </section>

      <section class="footprint-panel" aria-label="足迹列表" data-i18n-aria="listLabel">
        <div class="panel-heading">
          <h2 data-i18n="visitedPlaces">去过的地方</h2>
          <button class="text-button" id="clearButton" type="button" data-i18n="clearButton">清空</button>
        </div>
        <ol class="footprint-list" id="footprintList"></ol>
        <p class="empty-state" id="emptyState" data-i18n="emptyState">输入城市名并选择搜索结果，开始记录第一段旅程。</p>
      </section>
    </aside>

    <section class="map-area" aria-label="世界地图" data-i18n-aria="mapLabel">
      <div class="map-toolbar">
        <div>
          <strong id="selectedText">搜索城市添加足迹</strong>
          <span id="coordinateText">选择联想结果后会自动定位到地图</span>
        </div>
      </div>
      <div id="map" class="map"></div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js"></script>
  <script src="script.js"></script>
</body>
</html>
