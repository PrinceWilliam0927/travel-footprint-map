<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的世界足迹地图</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://tile.openstreetmap.org">
  <link rel="preconnect" href="https://nominatim.openstreetmap.org">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <aside class="sidebar" aria-label="足迹管理">
      <header class="brand">
        <p class="eyebrow">Travel Footprints</p>
        <h1>我的世界足迹</h1>
        <p class="stats"><span id="footprintCount">0</span> 个地点已点亮</p>
      </header>

      <form class="footprint-form" id="footprintForm" autocomplete="off">
        <label class="search-field">
          城市
          <input id="placeInput" name="place" type="search" placeholder="输入城市名，例如：上海、巴黎、东京" required>
          <div class="suggestions" id="suggestions" role="listbox" aria-label="城市搜索结果"></div>
        </label>

        <label>
          日期
          <input id="dateInput" name="date" type="date">
        </label>

        <label>
          备注
          <textarea id="noteInput" name="note" rows="3" placeholder="写一点这次旅程的记忆"></textarea>
        </label>

        <div class="actions">
          <button class="button primary" id="submitButton" type="submit">添加足迹</button>
          <button class="button ghost" id="locateButton" type="button">定位到我</button>
        </div>
      </form>

      <section class="footprint-panel" aria-label="足迹列表">
        <div class="panel-heading">
          <h2>去过的地方</h2>
          <button class="text-button" id="clearButton" type="button">清空</button>
        </div>
        <ol class="footprint-list" id="footprintList"></ol>
        <p class="empty-state" id="emptyState">输入城市名并选择搜索结果，开始记录第一段旅程。</p>
      </section>
    </aside>

    <section class="map-area" aria-label="世界地图">
      <div class="map-toolbar">
        <div>
          <strong id="selectedText">搜索城市添加足迹</strong>
          <span id="coordinateText">选择联想结果后会自动定位到地图</span>
        </div>
      </div>
      <div id="map" class="map"></div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
